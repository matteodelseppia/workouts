# WK8 SAT - PULL HARD (switch to Archer Pull Up)
date: 2026-10-10

exercises:
  - name: Archer Pull Up
    notes: "Primary top sets. Switching from Archer Chin Up to the strict pronated version — expect it to feel much harder for the same rep count. Goal is 5/side by Nov 1."
    sets:
      - reps: 2/side
      - reps: 2/side
      - reps: 2/side
      - reps: 2/side

  - name: Band-Assisted Archer Pull Up
    notes: "Backoff — high-quality volume with band assistance. Use a band that lets every rep move well; lighten it as reps get easier."
    sets:
      - reps: 6/side
      - reps: 6/side

  - name: Ring One Arm Push Up
    notes: "Secondary."
    sets:
      - reps: 4/side
      - reps: 4/side
      - reps: 4/side

  - name: Bar Tricep Extensions
    notes: "Tertiary. 10-12 reps."
    sets:
      - reps: 12
      - reps: 12
      - reps: 12
